spring.application.name=save-my-money
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/savemymoney}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secretpassword}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
jwt.public.key=classpath:public.pem
jwt.private.key=classpath:private.pem
logging.level.org.springframework.security=DEBUG