services:
  postgres:
    image: postgres:16.6-alpine
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - '5435:5432'
    environment:
      - POSTGRES_PASSWORD=123456
  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - '5050:80'
    depends_on:
      - postgres